<!DOCTYPE html>
<!--
  login.html — Portal Sign-In Page  (Sprint 1 / RBAC v2.0)
  Smart Hostel Management System

  Supports 4 roles:
    Student       — S001 / password123
    Warden        — W001 / warden123
    Admin         — A001 / admin123
    Security Guard — G001 / guard123
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portal Sign In — SmartHMS</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <header class="navbar">
    <a href="index.html" class="navbar-brand" style="text-decoration:none;">
      <span class="brand-icon">🏨</span>
      <div>
        <div style="color:var(--clr-text); font-weight:800;">SmartHMS</div>
        <div class="navbar-tagline">Smart Hostel Management System</div>
      </div>
    </a>
    <div style="margin-left:auto;display:flex;align-items:center;gap:10px;">
      <button type="button" class="theme-toggle-btn" id="themeToggleBtn" title="Toggle Light / Dark Mode">
        🌙 <span class="theme-label">Dark</span>
      </button>
      <a href="index.html" class="btn btn-outline btn-sm">← Back to Home</a>
    </div>
  </header>

  <main class="login-hero">
    <div class="login-card" style="max-width:480px;">

      <div style="margin-bottom:var(--sp-md);">
        <a href="index.html" style="font-size:0.84rem;color:var(--clr-primary);text-decoration:none;font-weight:600;">
          ← Return to Homepage
        </a>
      </div>

      <h2>Portal Login 🔐</h2>
      <p style="margin-bottom:var(--sp-md);">Select your role, then enter your credentials.</p>

      <!--
        4-ROLE TABS
        Each button carries data-role matching the roles in data.js users array.
        LoginModule._wireRoleTabs() wires up these clicks.
      -->
      <div class="role-tabs" id="roleTabs" style="flex-wrap:wrap; gap:var(--sp-xs);">
        <button type="button" class="role-tab active" data-role="student">🎓 Student</button>
        <button type="button" class="role-tab"        data-role="warden">🛡️ Warden</button>
        <button type="button" class="role-tab"        data-role="admin">⚙️ Admin</button>
        <button type="button" class="role-tab"        data-role="security">🔒 Security</button>
      </div>

      <!-- Error banner -->
      <div class="login-error" id="loginError"></div>

      <form id="loginForm" novalidate>

        <div class="form-group">
          <label for="userId">User ID</label>
          <input
            type="text" id="userId" name="userId" class="form-control"
            placeholder="e.g. S001, W001, A001, G001"
            autocomplete="username" required
          />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input
            type="password" id="password" name="password" class="form-control"
            placeholder="Enter your password"
            autocomplete="current-password" required
          />
        </div>

        <button type="submit" class="btn btn-primary btn-block" style="margin-top:var(--sp-sm);">
          Sign In →
        </button>

      </form>

      <!--
        DEMO HINT — dynamically updated by LoginModule._updateDemoHint()
        Shows the correct demo credentials for the currently selected role tab.
      -->
      <div class="demo-hint" id="demoHint" style="margin-top:var(--sp-md);"></div>

    </div>
  </main>

  <script src="data.js"></script>
  <script src="app.js"></script>

</body>
</html>
